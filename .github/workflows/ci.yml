name: Build installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run test:build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: npm run build
      - run: npm test
  desktop:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: package-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config patchelf xdg-utils
      - run: npm ci
      - run: cargo test --locked
      - name: Build executable and installers
        run: npm run build:desktop -- --ci --target ${{ matrix.target }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
      - name: Archive macOS app bundles preserving executable permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          while IFS= read -r -d '' app; do
            tar -czf "$app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          done < <(find target -type d -path '*/release/bundle/macos/*.app' -prune -print0)
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: read-only-calendar-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
